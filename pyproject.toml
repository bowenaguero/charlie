[project]
name = "charlie"
version = "0.1.1"
description = "Map XSOAR dependencies at the CLI"
authors = [{ name = "Bowen Aguero", email = "bowenaguero@proton.me" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
dependencies = [
    "typer>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "networkx>=3.2.0",
    "pyvis>=0.3.2",
    "rich>=13.0.0",
    "platformdirs>=4.0.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
charlie = "charlie.charlie:app"

[project.urls]
Homepage = "https://bowenaguero.github.io/charlie/"
Repository = "https://github.com/bowenaguero/charlie"
Documentation = "https://bowenaguero.github.io/charlie/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",

    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charlie"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PGH003"]
"src/charlie/commands/scan.py" = ["B008"]
"src/charlie/commands/setup.py" = ["S603", "S607"]
"src/charlie/services/scanner.py" = ["S603", "S607"]
"src/charlie/services/xsoar_downloader.py" = ["S603", "S607", "TRY003"]

[tool.ruff.format]
preview = true
